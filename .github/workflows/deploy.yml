name: Deploy to projects.tojek.com

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows manual "Run workflow" button on GitHub

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          # workbench/archive files the live site never serves:
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            HOW_THIS_WORKS.md
            build_index.py
            **/meta.json
            **/_sources/**
