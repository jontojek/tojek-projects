name: Deploy to projects.tojek.com

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows manual "Run workflow" button on GitHub

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          # workbench/archive files the live site never serves:
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            HOW_THIS_WORKS.md
            build_index.py
            **/meta.json
            **/_sources/**

      # A successful FTP transfer does not prove the files landed where the
      # site is served from. Fetch the live page and confirm.
      - name: Verify the live site actually updated
        run: |
          python3 - <<'PY'
          import re, sys, urllib.request

          pattern = r'<a class="card" href="([^"]+)"'
          want = set(re.findall(pattern, open('index.html', encoding='utf-8').read()))

          url = 'https://projects.tojek.com/'
          req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
          live = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
          have = set(re.findall(pattern, live))

          missing = sorted(want - have)
          if missing:
              print('FTP reported success, but %s is NOT serving: %s' % (url, missing))
              print('Expected %d project cards, live site has %d.' % (len(want), len(have)))
              print('Check the FTP account home in cPanel -> FTP Accounts -> Path.')
              print('It MUST be public_html/projects (the subdomain document root).')
              print('cPanel silently rewrites that field when you edit the username.')
              sys.exit(1)
          print('Verified: %s is serving all %d projects.' % (url, len(want)))
          PY
